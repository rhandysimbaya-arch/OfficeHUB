<script>
const $=id=>document.getElementById(id), E=Engine, ROWS=200, COLS=26, DW=84, DH=28;
let wb=new E.Workbook(), cur='Sheet1', sel={r1:1,c1:1,r2:1,c2:1}, anchor={r:1,c:1}, editing=false, showF=false, clip=null, design=false, freeze=false;
let book={modules:{Module1:''},shapes:{},forms:[],scenarios:[],name:'Book1',names:{}}; // shapes[sheet]=[...]
let tds=[]; let selShape=null; let dirty=false; let macroRT=null;
const sh=()=>wb.sheets[cur];
const key=(r,c)=>r+','+c;
function colW(c){return sh().colW[c]||DW}
/* ---------- render ---------- */
function build(){
  let h='<colgroup><col style="width:38px">';for(let c=1;c<=COLS;c++)h+=`<col style="width:${colW(c)}px">`;h+='</colgroup><thead><tr><th class="rh" style="top:0"></th>';
  for(let c=1;c<=COLS;c++)h+=`<th id="ch${c}" style="width:${colW(c)}px">${E.numToCol(c)}</th>`;
  h+='</tr></thead><tbody>';
  for(let r=1;r<=ROWS;r++){const rh=rowHt(r);h+=`<tr style="${rh===0?'display:none':'height:'+rh+'px'}"><th class="rh" id="rh${r}" style="${rh?'height:'+rh+'px':''}">${r}</th>`;for(let c=1;c<=COLS;c++)h+=`<td data-r="${r}" data-c="${c}"></td>`;h+='</tr>';}
  $('grid').innerHTML=h+'</tbody>';$('grid').classList.toggle('nogrid',sh().grid===false);let tw=38;for(let c=1;c<=COLS;c++)tw+=colW(c);$('grid').style.width=tw+'px';
  tds=[];const rows=$('grid').tBodies[0].rows;for(let r=0;r<ROWS;r++){tds[r+1]=[];for(let c=0;c<COLS;c++)tds[r+1][c+1]=rows[r].cells[c+1];}
  refresh();renderShapes();applyZoom();
}
function styleOf(r,c){return sh().style[key(r,c)]||null}
function cellText(r,c){
  const v=wb.value(cur,r,c); if(showF){const raw=wb.getRaw(cur,r,c);if(typeof raw==='string'&&raw[0]==='=')return raw;}
  return E.fmtNumber(v,sh().fmt[key(r,c)]);
}
let MM={};
function buildMM(){MM={};for(const m of (sh().merges||[])){for(let r=m.r1;r<=m.r2;r++)for(let c=m.c1;c<=m.c2;c++)MM[key(r,c)]='h';MM[key(m.r1,m.c1)]={rs:m.r2-m.r1+1,cs:m.c2-m.c1+1};}}
function rowHt(r){const S=sh(),h=S.rowH&&S.rowH[r];return h===undefined?(S.defSz!==undefined?20:DH):h}
const _cv=document.createElement('canvas').getContext('2d');
function famCss(f){return !f?'':(f.includes(',')?f:"'"+f+"',Arial,sans-serif")}
function isEmptyCell(r,c){if(MM[key(r,c)])return false;const v=wb.value(cur,r,c);return v===null||v===undefined||v===''}
function spill(td,r,c,txt,al,st,fs){
  const S=sh(),mm=MM[key(r,c)];let own=0;for(let k=c;k<c+(mm?mm.cs:1);k++)own+=colW(k);
  _cv.font=(st&&st.b?'bold ':'')+(st&&st.i?'italic ':'')+(fs||13)+'px '+(famCss((st&&st.font)||S.defFont)||'sans-serif');
  const tw=_cv.measureText(txt).width+10;if(tw<=own)return;
  let avail=own;
  if(al==='left'){for(let j=c+(mm?mm.cs:1);j<=COLS&&avail<tw&&isEmptyCell(r,j);j++)avail+=colW(j);}
  else{for(let j=c-1;j>=1&&avail<tw&&isEmptyCell(r,j);j--)avail+=colW(j);}
  if(avail<=own)return;
  td.style.overflow='visible';td.style.position='relative';td.style.zIndex='1';
  td.textContent='';const sp=document.createElement('span');sp.textContent=txt;
  sp.style.cssText='display:block;overflow:hidden;white-space:nowrap;width:'+(avail-8)+'px;'+(al==='right'?'margin-left:-'+(avail-own)+'px;text-align:right':'');
  td.appendChild(sp);
}
function paint(r,c){
  const td=tds[r]&&tds[r][c];if(!td)return;const k=key(r,c),mm=MM[k];
  if(mm==='h'){td.style.cssText='display:none';td.className='';return;}
  if(mm){if(td.colSpan!==mm.cs)td.colSpan=mm.cs;if(td.rowSpan!==mm.rs)td.rowSpan=mm.rs;}else{if(td.colSpan!==1)td.colSpan=1;if(td.rowSpan!==1)td.rowSpan=1;}
  const S=sh(),imp=S.defSz!==undefined,v=wb.value(cur,r,c),txt=cellText(r,c);let st=styleOf(r,c);if(window.xCF)st=xCF(r,c,st,v);
  const isNum=typeof v==='number'&&!showF, isErr=E.isErr(v);
  let al=st&&st.align||(isNum?'right':(typeof v==='boolean'||isErr)?'center':'left');
  let css='text-align:'+al+';height:'+rowHt(r)+'px;vertical-align:'+((st&&st.valign)||(imp?'bottom':'middle'))+';';
  const fs=(st&&st.sz)||S.defSz;if(fs)css+='font-size:'+fs+'px;';

function saveX(){const w=XLSX.utils.book_new();for(const n of wb.order){const ws={};let mr=1,mc=1;const s=wb.sheets[n];for(const k in s.cells){const [r,c]=k.split(',').map(Number);const cell=s.cells[k];const v=wb.value(n,r,c);const o={};if(cell.f){o.f=cell.f.slice(1);}if(E.isErr(v)){o.t='e';o.v=0;o.w=v.code;}else if(typeof v==='number'){o.t='n';o.v=v;}else if(typeof v==='boolean'){o.t='b';o.v=v;}else{o.t='s';o.v=v===null?'':String(v);}if(s.fmt[k])o.z=s.fmt[k];ws[E.addr(r,c)]=o;mr=Math.max(mr,r);mc=Math.max(mc,c);}for(const k in wb.spill){if(k.startsWith(n+'|')){const [r,c]=k.slice(n.length+1).split(',').map(Number);const v=wb.spill[k];ws[E.addr(r,c)]={t:typeof v==='number'?'n':'s',v:E.isErr(v)?v.code:v};mr=Math.max(mr,r);mc=Math.max(mc,c);}}if(s.merges&&s.merges.length)ws['!merges']=s.merges.map(m=>({s:{r:m.r1-1,c:m.c1-1},e:{r:m.r2-1,c:m.c2-1}}));ws['!cols']=[];for(let c=1;c<=mc;c++)ws['!cols'].push({wpx:s.colW[c]!==undefined?s.colW[c]:DW});ws['!rows']=[];for(let r=1;r<=mr;r++)ws['!rows'].push(s.rowH&&s.rowH[r]!==undefined?{hpx:s.rowH[r]}:{});ws['!ref']='A1:'+E.addr(mr,mc);XLSX.utils.book_append_sheet(w,ws,n.slice(0,31));}
  const out=XLSX.write(w,{bookType:'xlsx',type:'array'});RB.saveBlob(book.name+'.xlsx',new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  // also keep VBA source alongside
  const code=Object.entries(book.modules).map(([k,v])=>`' ---- ${k} ----\n${v}`).join('\n\n');if(code.trim())RB.saveBlob(book.name+'_macros.bas',new Blob([code],{type:'text/plain'}),'text/plain');}
function importWB(name,buf){const w=XLSX.read(buf,{type:'array',cellFormula:true,cellDates:false});wb=new E.Workbook();wb.sheets={};wb.order=[];for(const n of w.SheetNames){const s=wb.addSheet(n);const ws=w.Sheets[n];for(const a in ws){if(a[0]==='!')continue;const p=E.parseAddr(a);if(!p)continue;const c=ws[a];if(c.f)s.cells[key(p.r,p.c)]={f:'='+c.f};else if(c.t==='n'||c.t==='b'||c.t==='s'||c.t==='d')s.cells[key(p.r,p.c)]={v:c.t==='d'?E.dateToSerial(new Date(c.v)):c.v};else if(c.t==='e')s.cells[key(p.r,p.c)]={v:null};if(c.z&&c.z!=='General')s.fmt[key(p.r,p.c)]=c.z;}}if(!wb.order.length)wb.addSheet('Sheet1');cur=wb.order[0];book.name=name.replace(/\.[^.]+$/,'');$('ttl').textContent=book.name+' - Excel';
  const fin=info=>{if(info)for(const n of wb.order){const i=info.sheets[n];if(!i)continue;const s=wb.sheets[n];s.colW=i.colW;s.rowH={};for(let r=1;r<=ROWS;r++)s.rowH[r]=i.rowH[r]!==undefined?i.rowH[r]:i.drh;s.style=i.style;s.merges=i.merges;s.defSz=i.defSz;s.defFont=i.defFont;s.grid=i.grid;}

function drawChart(cv,s){const g=cv.getContext('2d'),W=cv.width,H=cv.height;g.fillStyle='#fff';g.fillRect(0,0,W,H);const d=chartData(s);if(d.length<2)return;const hdr=d[0],rows=d.slice(1);const ser=hdr.length-1;const pal=['#4472C4','#ED7D31','#A5A5A5','#FFC000','#5B9BD5','#70AD47'];const pad=40;g.font='22px sans-serif';
  if(s.kind==='pie'){const vals=rows.map(r=>Math.max(0,+r[1]||0)),tot=vals.reduce((a,b)=>a+b,0)||1;let a0=-Math.PI/2;const cx=W/2,cy=H/2,R=Math.min(W,H)/2-pad;vals.forEach((v,i)=>{const a1=a0+v/tot*2*Math.PI;g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,R,a0,a1);g.fillStyle=pal[i%6];g.fill();const m=(a0+a1)/2;g.fillStyle='#000';g.fillText(String(rows[i][0]),cx+Math.cos(m)*R*0.65-20,cy+Math.sin(m)*R*0.65);a0=a1;});return;}
  let mx=0,mn=0;rows.forEach(r=>{for(let j=1;j<=ser;j++){const v=+r[j]||0;mx=Math.max(mx,v);mn=Math.min(mn,v);}});if(mx===mn)mx=mn+1;const pw=W-pad*1.6,ph=H-pad*1.6,x0=pad*1.2,y0=H-pad;const Y=v=>y0-(v-mn)/(mx-mn)*ph;

  const n=rows.length,bw=pw/n;rows.forEach((r,i)=>{g.fillStyle='#000';g.fillText(String(r[0]).slice(0,6),x0+i*bw,H-8);for(let j=1;j<=ser;j++){const v=+r[j]||0;if(s.kind==='bar'){g.fillStyle=pal[(j-1)%6];const w=bw*0.8/ser;g.fillRect(x0+i*bw+bw*0.1+(j-1)*w,Y(Math.max(v,0)),w,Math.abs(Y(v)-Y(0)));}}});

function goalSeek(){gen('Goal Seek',`<label>Set cell (a formula)</label><input type="text" id="gs1" value="${E.addr(anchor.r,anchor.c)}"><label>To value</label><input type="text" id="gs2" value="0"><label>By changing cell</label><input type="text" id="gs3" placeholder="e.g. B1">`,[['Solve',()=>{try{const t=refCell($('gs1').value),goal=parseFloat($('gs2').value),x=refCell($('gs3').value);const f=v=>{wb.setRaw(cur,x.r,x.c,v);wb.recalc();const y=wb.value(cur,t.r,t.c);if(typeof y!=='number')throw new Error('Set cell must evaluate to a number');return y-goal;};const orig=wb.getRaw(cur,x.r,x.c);let x0=parseFloat(orig)||1,x1=x0+1,f0=f(x0),f1=f(x1);for(let i=0;i<100&&Math.abs(f1)>1e-9;i++){if(f1===f0)break;const x2=x1-f1*(x1-x0)/(f1-f0);x0=x1;f0=f1;x1=x2;f1=f(x1);}if(Math.abs(f1)<1e-6){wb.setRaw(cur,x.r,x.c,+x1.toPrecision(12));save();refresh();closeGen();alert('Goal Seek found a solution: '+E.addr(x.r,x.c)+' = '+(+x1.toPrecision(8)));}else{wb.setRaw(cur,x.r,x.c,orig);refresh();alert('Goal Seek may not have found a solution.');}}catch(e){alert(e.message||e);}}]]);}

function showForm(f){const rt=getRT();const prevActive=activeForm;activeForm={f,els:{}};const root=$('ufRun');root.innerHTML='';root.style.width=f.w+'px';root.style.height=f.h+'px';$('ufRunT').textContent=f.caption||f.name;
  f.controls.forEach(c=>{const {d,el}=mkCtl(c);root.appendChild(d);activeForm.els[c.name]=el;if(c.type==='CommandButton'){el.onclick=()=>{const m=c.macro||(c.name+'_Click');runMacro(m,true);};}});
  rt.proc=null;if(rt.hasProc(f.name+'_Initialize'))try{rt.run(f.name+'_Initialize',[])}catch(e){showErr(e)}

/* runtime wiring */
function getRT(){if(macroRT)return macroRT;macroRT=new V.Runtime({
  msgBox(msg,btn,title){const k=btn&7;if(k===0)alert(msg);else{const ok=confirm(msg);return k===4||k===3?(ok?6:7):(ok?1:2);}return 1},
  inputBox(p,t,d){const r=prompt(p,d||'');return r===null?'':r},
  print(s){const o=$('vbaOut');if(o)o.textContent+=s+'\n';},
  createObject(t){return null},
  unload(o){closeRun(o&&o.name?formByName(o.name):null)},
  me(ctx){return activeForm?formObj(activeForm.f):null},
  global(key,args,hasArgs,ctx){
    switch(key){case 'range':return rangeFrom(cur,args);case 'cells':return sheetObj(cur).vbGet('cells',args);case 'rows':return sheetObj(cur).vbGet('rows',args);case 'columns':return sheetObj(cur).vbGet('columns',args);
      case 'selection':return new VRange(cur,sel.r1,sel.c1,sel.r2,sel.c2);case 'activecell':return new VRange(cur,anchor.r,anchor.c,anchor.r,anchor.c);case 'activesheet':return sheetObj(cur);case 'thisworkbook':case 'activeworkbook':return wbObj;case 'application':return appObj;case 'worksheets':case 'sheets':{const c=sheetsColl();return hasArgs&&args.length?c.vbGet('',args):c}
      case 'evaluate':return toV(E.evaluate(wb,cur,String(args[0])));case 'worksheetfunction':return appObj.vbGet('worksheetfunction',[]);}
    if(activeForm){const c=activeForm.f.controls.find(x=>x.name.toLowerCase()===key);if(c)return ctlObj(activeForm.f,c);}
    const f=formByName(key);if(f)return formObj(f);
    if(book.names[key.toUpperCase()])return rangeFrom(cur,[key]);
    return undefined;}});
  book._sources={};return macroRT}
function loadMacros(){macroRT=null;const rt=getRT();let errs=[];for(const m in book.modules){try{rt.load(book.modules[m],{module:m});}catch(e){errs.push(m+': '+(e.description||e.message));}}return errs;}
function macroNames(){const errs=loadMacros();const rt=getRT();return rt.listProcs().map(p=>p.name);}
function showErr(e){const msg=e&&e.description?`Run-time error '${e.number}':\n${e.description}`:String(e&&e.message||e);alert(msg);return msg}
function runMacro(name,fromForm){const errs=loadMacros();if(errs.length){alert('Syntax problem in macro code:\n'+errs.join('\n'));return}const rt=getRT();$('vbaOut')&&($('vbaOut').textContent='');try{rt.run(name,[]);}catch(e){showErr(e)}fresh();refresh();if(!fromForm)save();}

function vbaFill(){$('modSel').innerHTML=Object.keys(book.modules).map(k=>`<option ${k===curMod?'selected':''}>${k}</option>`).join('');$('vbaTxt').value=book.modules[curMod]||'';}
function vbaSel(){vbaSave();curMod=$('modSel').value;$('vbaTxt').value=book.modules[curMod]||'';}

function vbaRunDlg(){vbaSave();const errs=loadMacros();const o=$('vbaOut');o.textContent='';if(errs.length){o.textContent='Syntax error: '+errs.join('\n');return}const names=getRT().listProcs().map(p=>p.name);if(!names.length){o.textContent='No Sub procedures found.';return}

/* UserForm designer */
let ufCur=null,ufSelC=null;
function ufList(){const h=book.forms.map((f,i)=>`<div style="padding:12px;border-bottom:1px solid #eee;display:flex;gap:6px"><b style="flex:1" onclick="ufEdit(${i})">${f.name}</b><button onclick="ufEdit(${i})">Design</button><button onclick="ufRunI(${i})">Run</button><button onclick="ufDel(${i})">&times;</button></div>`).join('')||'<p>No UserForms yet.</p>';gen('UserForms',h,[['+ New UserForm',()=>{const n='UserForm'+(book.forms.length+1);book.forms.push({name:n,caption:n,w:300,h:220,controls:[]});save();ufEdit(book.forms.length-1);}]]);}

function ufRender(){const f=ufCur;const tb=['Label','TextBox','CommandButton','CheckBox','OptionButton','ComboBox','ListBox'];
  let h=`<div class="tool">${tb.map(t=>`<button onclick="ufAdd('${t}')">+ ${t}</button>`).join('')}</div><div style="overflow:auto;max-height:44vh"><div class="ufd" id="ufd" style="width:${f.w}px;height:${f.h}px"></div></div><div class="pr" id="ufp"></div><div class="row" style="margin-top:8px"><button class="sec" onclick="ufDelC()">Delete control</button><button class="sec" onclick="ufTest()">Test</button><button onclick="$('mUF').style.display='none';save()">Done</button></div>`;
  $('ufB').innerHTML=h;const d=$('ufd');f.controls.forEach(c=>{const {d:el}=mkCtl(c);el.classList.toggle('sel',c===ufSelC);el.querySelectorAll('input,select,textarea,button').forEach(x=>x.style.pointerEvents='none');el.style.touchAction='none';let pd=null;
    el.addEventListener('pointerdown',e=>{e.stopPropagation();ufSelC=c;pd={x:e.clientX,y:e.clientY,cx:c.x,cy:c.y,cw:c.w,ch:c.h,rz:(e.offsetX>el.offsetWidth-16&&e.offsetY>el.offsetHeight-16)};el.setPointerCapture(e.pointerId);d.querySelectorAll('.c').forEach(q=>q.classList.remove('sel'));el.classList.add('sel');ufProps();});
    el.addEventListener('pointermove',e=>{if(!pd)return;const dx=e.clientX-pd.x,dy=e.clientY-pd.y;if(pd.rz){c.w=Math.max(20,pd.cw+dx);c.h=Math.max(16,pd.ch+dy);}else{c.x=Math.max(0,pd.cx+dx);c.y=Math.max(0,pd.cy+dy);}el.style.left=c.x+'px';el.style.top=c.y+'px';el.style.width=c.w+'px';el.style.height=c.h+'px';});
    el.addEventListener('pointerup',()=>{pd=null;ufProps();});d.appendChild(el);});ufProps();}
function ufAdd(t){const n=ufCur.controls.filter(c=>c.type===t).length+1;const c={type:t,name:t+n,text:t==='Label'?'Label'+n:t==='CommandButton'?'Button'+n:t==='TextBox'?'':t+n,x:10+ufCur.controls.length*6,y:10+ufCur.controls.length*24%180,w:t==='CommandButton'?90:120,h:t==='ListBox'?70:24,items:(t==='ComboBox'||t==='ListBox')?['Item 1','Item 2']:undefined,macro:''};ufCur.controls.push(c);ufSelC=c;ufRender();}

function ufProps(){const c=ufSelC,f=ufCur;const p=$('ufp');if(!c){p.innerHTML=`<span>Form name</span><input value="${f.name}" onchange="ufCur.name=this.value.replace(/\\W/g,'')||ufCur.name"><span>Caption</span><input value="${f.caption||''}" onchange="ufCur.caption=this.value"><span>Width</span><input type="number" value="${f.w}" onchange="ufCur.w=+this.value;ufRender()"><span>Height</span><input type="number" value="${f.h}" onchange="ufCur.h=+this.value;ufRender()">`;return}
  const names=macroNames();p.innerHTML=`<span>(Name)</span><input value="${c.name}" onchange="ufSelC.name=this.value.replace(/\\W/g,'')||ufSelC.name"><span>Caption/Text</span><input value="${(c.text||'').replace(/"/g,'&quot;')}" onchange="ufSelC.text=this.value;ufRender()">`+(c.type==='CommandButton'?`<span>OnClick macro</span><select onchange="ufSelC.macro=this.value"><option value="">(${c.name}_Click)</option>${names.map(n=>`<option ${n===c.macro?'selected':''}>${n}</option>`).join('')}</select>`:'')+((c.type==='ComboBox'||c.type==='ListBox')?`<span>Items (comma)</span><input value="${(c.items||[]).join(',')}" onchange="ufSelC.items=this.value.split(',')">`:'')+`<span>Left / Top</span><span>${Math.round(c.x)} / ${Math.round(c.y)}</span><span>Width / Height</span><span>${Math.round(c.w)} / ${Math.round(c.h)}</span>`;}
function ufTest(){save();$('mUF').style.display='none';loadMacros();showForm(ufCur);}
